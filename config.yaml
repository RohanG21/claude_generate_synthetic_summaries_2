# =====================================================================
# Shared settings. Per-scan measurements live in two files each:
#   styles/<scan>.style.yaml          how the writing looks
#   structures/<scan>.structure.yaml  where the writing sits on the page
# Paths are relative to this file's folder.
#
# Value formats:  12 | {mean: 12, sd: 2} | [10, 14]
# =====================================================================

scans_dir: scans            # real scans to measure (.jpg/.png/.tif)
styles_dir: styles
structures_dir: structures
texts_dir: texts            # .txt files to write, one document per file
out_dir: out

# ---------------- Generation
variants: 3                 # images per (text file, style) pair, each with new random variation
seed: 1
variation: 1.0              # scales every measured spread (0 = copy each scan's averages exactly)
max_pages: 10               # long texts continue onto extra pages, up to this many

# ---------------- How .txt files are read
# A blank line in a .txt file always starts a new paragraph on a new line.
keep_line_breaks: false     # true = also start a new handwritten line at every single line break
paragraph_gap_lines: 0      # extra empty space between paragraphs, in lines (0.5 = half a line)

# ---------------- Handwriting fonts (weight 0 = off)
fonts_dir: fonts
handwriting_fonts:
  HomemadeApple-Regular.ttf: 3
  LaBelleAurore.ttf: 3
  Kristi-Regular.ttf: 1
  Cedarville-Cursive.ttf: 2
  Zeyada.ttf: 1
  DawningofaNewDay.ttf: 1
  ReenieBeanie.ttf: 0
  Caveat.ttf: 0
  Kalam-Regular.ttf: 0
  IndieFlower-Regular.ttf: 0
  NothingYouCouldDo.ttf: 0
  ShadowsIntoLight.ttf: 0
  WaitingfortheSunrise.ttf: 0
  JustMeAgainDownHere.ttf: 0
  OvertheRainbow.ttf: 0

# ---------------- Per-character jitter
char_jitter:
  size_rel: {mean: 0, sd: 0.12}
  rotation_deg: {mean: 0, sd: 1.5}
  baseline_px: {mean: 0, sd: 2.5}
  spacing_px: {mean: 0, sd: 1.0}
  wobble:
    amplitude_px: [2.0, 6.0]
    wavelength_px: [300, 700]

# ---------------- Elastic distortion (bends strokes so fonts look less regular)
elastic:
  alpha_px: [3, 6]
  sigma_px: [8, 14]

# ---------------- Extra capture noise (gray levels, mode, and skew come from each style file)
scan:
  blur_sigma: [0.6, 1.0]
  speckle_rate: [0.0, 0.00005]
  stroke_break_rate: [0.0, 0.002]
  jpeg_quality: 75          # null = off; only used in gray mode
